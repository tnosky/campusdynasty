{% extends "base.html" %}
{% block content %}
<h2>Race Simulator for {{ meet_name }}</h2>
<p>Click the button below to start the race simulation.</p>
<form method="post" action="{{ url_for('start_race', meet_name=meet_name) }}">
  <button type="submit" class="btn btn-danger">Start Race</button>
</form>
{% endblock %}
